name: Daily RSI scan

on:
  schedule:
    # 00:15 UTC every day: after the US close, and right after the daily crypto candle closes
    - cron: "15 0 * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Save results
        run: |
          git config user.name "rsi-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data.json derivs_history.json ccy_cache.json; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Daily scan $(date -u +%F)" || echo "No changes"
          git push
